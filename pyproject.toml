[project]
name = "nemdb"
version = "0.1.0"
description = "Utilities to process NEMWEB data"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.13.3",
    "click>=8.1.8",
    "fastexcel>=0.16.0",
    "fsspec>=2025.3.2",
    "gcsfs>=2025.3.2",
    "geopandas>=1.1.1",
    "numpy>=2.2.1",
    "pandas>=2.2.3",
    "pandera>=0.26.1",
    "polars>=1.35",
    "pyarrow>=22.0.0",
    "requests>=2.32.3",
    "structlog>=25.1.0",
    "tqdm>=4.67.1",
]

[project.scripts]
populate = "nemdb:main.populate"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ipykernel>=6.30.0",
    "pre-commit>=4.3.0",
    "pytest>=8.4.1",
    "pytest-mock>=3.15.1",
    "ruff>=0.14.6",
    "pytest-cov>=6.0.0",
    "mypy>=1.15.0",
    "pandas-stubs>=2.2.3.241201",
    "types-requests>=2.32.0.20250127",
    "types-beautifulsoup4>=4.12.0.20250127",
    "bandit[toml]>=1.8.2",
]
doc = [
    "mkdocs>=1.6.1",
    "mkdocs-autoapi>=0.4.1",
    "mkdocs-material>=9.6.16",
    "mkdocstrings[python]>=0.30.1",
]
grid = [
    "pandapower>=3.2.0",
    "scikit-learn>=1.7.2",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "ARG", "SIM", "TCH", "PTH", "ERA", "PL", "RUF"]
ignore = ["E501", "PLR0913", "PLR2004"]

[tool.ruff.lint.isort]
known-first-party = ["nemdb"]

[tool.ruff.lint.per-file-ignores]
"test/**/*.py" = ["ARG", "PLR2004"]
"src/nemdb/__init__.py" = ["I001"]  # Prevent import sorting to avoid circular imports

[tool.pytest.ini_options]
testpaths = ["test"]
addopts = [
    "-v",
    "--strict-markers",
    "--cov=nemdb",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=html",
    "--cov-report=xml",
    "--cov-fail-under=40",
]
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
precision = 2
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["geopandas.*", "gcsfs.*", "fastexcel.*", "polars.*", "pandera.*", "structlog.*", "fsspec.*"]
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["test", "notebooks", ".venv"]
skips = ["B101"]
