[project]
name = "nemdb"
version = "0.1.0"
description = "Utilities to process NEMWEB data"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.13.3",
    "click>=8.1.8",
    "fastexcel>=0.16.0",
    "fsspec>=2025.3.2",
    "gcsfs>=2025.3.2",
    "geopandas>=1.1.1",
    "networkx>=3.0",
    "numpy>=2.2.1",
    "openelectricity>=0.9.2",
    "pandas>=2.2.3",
    "pandera>=0.26.1",
    "polars>=1.35",
    "pyarrow>=22.0.0",
    "requests>=2.32.3",
    "scikit-learn>=1.7.2",
    "structlog>=25.1.0",
    "tqdm>=4.67.1",
]

[project.scripts]
populate = "nemdb:main.populate"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ipykernel>=6.30.0",
    "pre-commit>=4.3.0",
    "pytest>=8.4.1",
    "pytest-cov>=6.0",
    "pytest-mock>=3.15.1",
    "pyright>=1.1.383",
    "ruff>=0.14.6",
]
doc = [
    "mkdocs>=1.6.1",
    "mkdocs-autoapi>=0.4.1",
    "mkdocs-material>=9.6.16",
    "mkdocstrings[python]>=0.30.1",
]
grid = [
    "pandapower>=3.2.0",
    "scikit-learn>=1.7.2",
]
viz = [
    "plotly>=6.5.2",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "C4", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["nemdb"]

[tool.pyright]
include = ["src", "tests"]
exclude = [".venv"]
typeCheckingMode = "standard"
reportMissingTypeStubs = false
reportGeneralTypeIssues = true
reportOptionalMemberAccess = true
reportOptionalOperand = true

[tool.pytest.ini_options]
addopts = "--cov=nemdb --cov-report=term-missing:skip-covered"
testpaths = ["tests"]
